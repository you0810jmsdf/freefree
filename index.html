<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>千葉ニュータウン地域掲示板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #5ba896;
  --primary-dark: #3d8374;
  --accent: #7fc4a8;
  --bg: #f2f8f5;
  --card: #ffffff;
  --text: #2b3a35;
  --muted: #6b7a74;
  --border: #d8e8df;
  --shadow: 0 2px 8px rgba(61,131,116,0.10);
  --font: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}
.header {
  background: var(--primary);
  color: white;
  padding: 16px 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 { margin: 0; font-size: 20px; }
.header a { color: white; text-decoration: none; font-size: 14px; }
.cocola-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: linear-gradient(135deg, #a8dcc6 0%, #5ba896 100%);
  color: #1e4a3f !important;
  border-radius: 20px;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  transition: transform 0.15s, box-shadow 0.15s;
}
.cocola-link:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.cocola-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #1e4a3f;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.6);
}
.poster-comment {
  background: #e8f5ee;
  border-left: 3px solid var(--primary);
  color: #2d5a48;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  margin: 6px 0;
  line-height: 1.45;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.poster-comment a { color: var(--primary-dark); text-decoration: underline; }
.poster-comment.modal {
  font-size: 14px;
  padding: 10px 14px;
  margin: 8px 0 12px;
}
.container { max-width: 1100px; margin: 0 auto; padding: 20px; }
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 20px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 8px 18px;
  background: white;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 13px;
  font-family: var(--font);
  font-weight: 500;
  color: var(--muted);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.tab.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}
.poster-card {
  background: var(--card);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: transform 0.15s;
}
.poster-card:hover { transform: translateY(-2px); }
.poster-img-wrap {
  width: 100%;
  aspect-ratio: 210 / 297;
  background: #eee;
  overflow: hidden;
}
.poster-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.poster-info { padding: 12px 14px; font-size: 13px; flex: 1; }
.poster-info h3 { margin: 0 0 6px; font-size: 15px; color: var(--primary-dark); }
.poster-info .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.poster-info .pr { font-size: 12px; color: var(--text); white-space: pre-wrap; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  background: var(--accent);
  color: white;
  margin-right: 4px;
}
.badge.event { background: #e08a5f; }
.contact-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.contact-row a {
  font-size: 12px;
  padding: 4px 10px;
  background: var(--primary);
  color: white;
  text-decoration: none;
  border-radius: 12px;
}
.contact-row a.sub { background: #6b6b6b; }
.modal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal.open { display: flex; }
.modal-content {
  background: white;
  border-radius: 12px;
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
}
.modal-content h2 { margin-top: 0; color: var(--primary-dark); }
.modal-close { float: right; cursor: pointer; font-size: 24px; color: var(--muted); }
.biz-group { margin-bottom: 32px; }
.biz-cat-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary-dark);
  border-bottom: 2px solid var(--accent);
  padding-bottom: 6px;
  margin: 0 0 14px;
}
.biz-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.biz-card {
  background: var(--card);
  border-radius: 10px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
  font-size: 13px;
}
.biz-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 4px;
}
.biz-meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.biz-pr { color: var(--text); white-space: pre-wrap; margin-bottom: 6px; }
.contact-row span {
  font-size: 12px;
  padding: 4px 10px;
  background: var(--bg);
  color: var(--text);
  border-radius: 12px;
  border: 1px solid var(--border);
}
.loading { text-align: center; padding: 40px; color: var(--muted); }
.empty { text-align: center; padding: 40px; color: var(--muted); }
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .poster-info h3 { font-size: 13px; }
  .header {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
  }
  .header h1 { font-size: 17px; }
  .header > div { flex-wrap: wrap; }
  .container { padding: 12px; }
  .modal { padding: 10px; }
  .modal-content { padding: 16px; }
}
</style>
</head>

<div class="container">
  <div id="tabs" class="tabs"></div>
  <div id="poster-grid" class="grid"><div class="loading">読み込み中...</div></div>
  <div id="business-list" style="display:none"></div>
</div>

<!-- 詳細モーダル -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">×</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx94vdZCnI_kxOoyvCyVHBpVSVBVg2eUei0LQcqp0qf4buGzcdg-AadP9ec51s1jaYIGg/exec';

async function gasPost(action, params) {
  const resp = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action, ...params }) });
  return resp.json();
}

function getVisitorId() {
  let id = localStorage.getItem('visitor_id');
  if (!id) {
    id = 'V-' + Math.random().toString(36).substr(2, 10) + Date.now().toString(36);
    localStorage.setItem('visitor_id', id);
  }
  return id;
}

function getDevice() {
  return /Mobile|Android|iPhone/.test(navigator.userAgent) ? 'mobile' : 'desktop';
}

async function logEvent(eventType, posterId) {
  try {
    await gasPost('logEvent', { data: {
      event_type: eventType,
      poster_id: posterId || '',
      referrer: document.referrer || '',
      device: getDevice(),
      visitor_id: getVisitorId()
    }});
  } catch(e) { console.warn('log error', e); }
}

let allPosters = [];
let allBusinesses = [];
let currentCategory = 'all';
let currentBizCategory = 'all';
let categories = [];

function doLogout() {
  sessionStorage.removeItem('myEmail');
  document.getElementById('logout-btn').style.display = 'none';
}

async function loadSettings() {
  try {
    const resp = await fetch(GAS_URL + '?page=api&action=settings');
    const data = await resp.json();
    if (data.ok) {
      categories = data.categories || [];
      if (data.siteName) {
        document.title = data.siteName;
        document.getElementById('site-title').textContent = data.siteName;
      }
    }
  } catch(e) { console.warn('settings load error', e); }
}

window.addEventListener('load', async () => {
  await loadSettings();
  renderTabs();
  loadPosters();
  logEvent('page_view', '');
  if (sessionStorage.getItem('myEmail')) {
    document.getElementById('logout-btn').style.display = '';
  }

  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
});

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const items = [
    { key: 'all', label: 'すべて' },
    { key: 'event', label: '📢 イベント告知' },
    ...categories.map(c => ({ key: c, label: c })),
    { key: 'businesses', label: '🏪 事業者' }
  ];
  tabs.innerHTML = items.map(i =>
    `<div class="tab ${i.key === currentCategory ? 'active' : ''}" onclick="selectTab('${i.key}')">${i.label}</div>`
  ).join('');
}

function selectTab(key) {
  currentCategory = key;
  renderTabs();
  if (key === 'businesses') {
    document.getElementById('poster-grid').style.display = 'none';
    document.getElementById('business-list').style.display = '';
    loadBusinesses();
  } else {
    document.getElementById('poster-grid').style.display = '';
    document.getElementById('business-list').style.display = 'none';
    renderPosters();
  }
}

function loadPosters() {
  fetch(GAS_URL + '?page=api')
    .then(r => r.json())
    .then(data => { allPosters = data.posters || []; renderPosters(); })
    .catch(() => {
      document.getElementById('poster-grid').innerHTML =
        '<div class="empty">ポスターの読み込みに失敗しました。再読み込みしてください。</div>';
    });
}

function renderPosters() {
  const grid = document.getElementById('poster-grid');
  let list = allPosters;
  if (currentCategory === 'event') {
    list = list.filter(p => p.poster_type === 'イベント');
  } else if (currentCategory !== 'all') {
    list = list.filter(p => p.category === currentCategory);
  }
  if (list.length === 0) {
    grid.innerHTML = '<div class="empty">掲載中のポスターはありません</div>';
    return;
  }
  grid.innerHTML = list.map(p => `
    <div class="poster-card" onclick="openDetail('${p.poster_id}')">
      <div class="poster-img-wrap">
        <img src="${p.image_url}" alt="${escapeHtml(p.title)}" loading="lazy" onerror="this.style.background='#ddd';this.src=''">
      </div>
      <div class="poster-info">
        <div>
          ${p.poster_type === 'イベント' ? '<span class="badge event">イベント</span>' : ''}
          ${p.category ? `<span class="badge">${escapeHtml(p.category)}</span>` : ''}
        </div>
        <h3>${escapeHtml(p.business.business_name)}</h3>
        <div class="meta">${escapeHtml(p.business.area)}${p.business.address ? ' / ' + escapeHtml(p.business.address) : ''}</div>
        ${p.comment ? `<div class="poster-comment">${linkify(p.comment)}</div>` : ''}
        <div class="pr">${escapeHtml(truncate(p.business.pr_text, 60))}</div>
      </div>
    </div>
  `).join('');
}

function openDetail(posterId) {
  const p = allPosters.find(x => x.poster_id === posterId);
  if (!p) return;
  logEvent('detail_click', posterId);
  const b = p.business;
  const contacts = [];
  (b.contact_method || []).forEach(m => {
    if (m === 'メール' && b.email) contacts.push(`<a href="mailto:${b.email}" onclick="logEvent('contact_click','${posterId}')">✉️ メール</a>`);
    if (m === '電話' && b.phone) contacts.push(`<a href="tel:${b.phone}" onclick="logEvent('contact_click','${posterId}')">📞 電話</a>`);
    if (m === 'LINE公式' && b.line_url) contacts.push(`<a href="${b.line_url}" target="_blank" onclick="logEvent('contact_click','${posterId}')">LINE</a>`);
    if (m === '自社サイト/SNS URL') {
      if (b.website_url) contacts.push(`<a class="sub" href="${b.website_url}" target="_blank" onclick="logEvent('website_click','${posterId}')">🌐 サイト</a>`);
      if (b.sns_url) contacts.push(`<a class="sub" href="${b.sns_url}" target="_blank" onclick="logEvent('website_click','${posterId}')">📱 SNS</a>`);
    }
  });

  document.getElementById('modal-body').innerHTML = `
    <h2>${escapeHtml(b.business_name)}</h2>
    <div style="margin-bottom:12px">
      ${p.poster_type === 'イベント' ? '<span class="badge event">イベント</span>' : ''}
      ${p.category ? `<span class="badge">${escapeHtml(p.category)}</span>` : ''}
    </div>
    <img src="${p.image_url}" style="width:100%;border-radius:8px;margin-bottom:12px">
    <h3 style="margin:8px 0">${escapeHtml(p.title)}</h3>
    ${p.comment ? `<div class="poster-comment modal">${linkify(p.comment)}</div>` : ''}
    <p style="white-space:pre-wrap;word-break:break-word">${linkify(b.pr_text)}</p>
    <div style="font-size:13px;color:#666;margin:12px 0">
      ${b.address ? '📍 ' + escapeHtml(b.address) + '<br>' : ''}
      ${b.area ? 'エリア: ' + escapeHtml(b.area) + '<br>' : ''}
      ${p.poster_type === 'イベント' ? '開催期間: ' + p.start_date + ' 〜 ' + p.end_date : ''}
    </div>
    <div class="contact-row">${contacts.join('')}</div>
  `;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function loadBusinesses() {
  const el = document.getElementById('business-list');
  if (allBusinesses.length > 0) { renderBusinessList(); return; }
  el.innerHTML = '<div class="loading">読み込み中...</div>';
  fetch(GAS_URL + '?page=api&type=businesses')
    .then(r => r.json())
    .then(data => { allBusinesses = data.businesses || []; renderBusinessList(); })
    .catch(() => { el.innerHTML = '<div class="empty">読み込みに失敗しました</div>'; });
}

function selectBizCategory(cat) {
  currentBizCategory = cat;
  renderBusinessList();
}

function renderBusinessList() {
  const el = document.getElementById('business-list');
  if (allBusinesses.length === 0) {
    el.innerHTML = '<div class="empty">登録事業者はまだいません</div>';
    return;
  }
  const cats = [...new Set(allBusinesses.map(b => b.category || 'その他'))];
  const filtered = currentBizCategory === 'all'
    ? allBusinesses
    : allBusinesses.filter(b => (b.category || 'その他') === currentBizCategory);

  const pills = ['all', ...cats].map(c => {
    const label = c === 'all' ? 'すべて' : c;
    const active = c === currentBizCategory ? 'active' : '';
    return `<button class="tab ${active}" onclick="selectBizCategory('${escapeHtml(c)}')">${escapeHtml(label)}</button>`;
  }).join('');

  const grouped = {};
  filtered.forEach(b => {
    const cat = b.category || 'その他';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(b);
  });
  const listHtml = currentBizCategory !== 'all'
    ? `<div class="biz-list">${filtered.map(b => renderBizCard(b)).join('')}</div>`
    : Object.entries(grouped).map(([cat, list]) => `
        <div class="biz-group">
          <h3 class="biz-cat-title">${escapeHtml(cat)}</h3>
          <div class="biz-list">${list.map(b => renderBizCard(b)).join('')}</div>
        </div>
      `).join('');

  el.innerHTML = `<div class="tabs" style="margin-bottom:16px">${pills}</div>${listHtml}`;
}

function renderBizCard(b) {
  const contacts = [];
  (b.contact_method || []).forEach(m => {
    if (m === 'メール' && b.email) contacts.push(`<a href="mailto:${b.email}">✉️ メール</a>`);
    if (m === '電話' && b.phone) contacts.push(`<span>📞 ${escapeHtml(b.phone)}</span>`);
    if (m === 'LINE公式' && b.line_url) contacts.push(`<a href="${b.line_url}" target="_blank" rel="noopener">LINE</a>`);
    if (m === '自社サイト/SNS URL') {
      if (b.website_url) contacts.push(`<a href="${b.website_url}" target="_blank" rel="noopener">🌐 サイト</a>`);
      if (b.sns_url) contacts.push(`<a href="${b.sns_url}" target="_blank" rel="noopener">📱 SNS</a>`);
    }
  });
  return `
    <div class="biz-card">
      <div class="biz-name">${escapeHtml(b.business_name)}${b.entity_type === '団体' ? ' <span class="badge">団体</span>' : ''}</div>
      <div class="biz-meta">${b.area ? escapeHtml(b.area) : ''}${b.address ? ' / ' + escapeHtml(b.address) : ''}</div>
      ${b.pr_text ? `<div class="biz-pr">${escapeHtml(truncate(b.pr_text, 80))}</div>` : ''}
      ${contacts.length ? `<div class="contact-row">${contacts.join('')}</div>` : ''}
    </div>
  `;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function truncate(s, n) { s = s || ''; return s.length > n ? s.slice(0, n) + '…' : s; }
function linkify(s) {
  return escapeHtml(s).replace(/(https?:\/\/[^\s<>"']+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
